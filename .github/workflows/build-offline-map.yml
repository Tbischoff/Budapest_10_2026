name: Build offline map

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "offline_map_jobs UUID"
        required: true
        type: string
      trip_id:
        description: "Trip UUID"
        required: true
        type: string
      destination:
        description: "Destination label"
        required: true
        type: string
      min_lon:
        required: true
        type: string
      min_lat:
        required: true
        type: string
      max_lon:
        required: true
        type: string
      max_lat:
        required: true
        type: string
      max_zoom:
        required: false
        default: "15"
        type: string

permissions:
  contents: read

concurrency:
  group: offline-map-${{ inputs.trip_id }}
  cancel-in-progress: false

jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://fjlezfzninkltblcctds.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      S3_ENDPOINT: https://fjlezfzninkltblcctds.storage.supabase.co/storage/v1/s3
      AWS_DEFAULT_REGION: eu-central-1
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      BUCKET: offline-maps
      OUTPUT_FILE: offline-map.pmtiles
      AWS_CLI_FILE_ENCODING: UTF-8

    steps:
      - name: Mark job processing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X PATCH "$SUPABASE_URL/rest/v1/offline_map_jobs?id=eq.${{ inputs.job_id }}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data '{"status":"processing","started_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math, uuid
          vals = {}
          raw = {
              "min_lon": "${{ inputs.min_lon }}",
              "min_lat": "${{ inputs.min_lat }}",
              "max_lon": "${{ inputs.max_lon }}",
              "max_lat": "${{ inputs.max_lat }}"
          }
          for key, value in raw.items():
              vals[key] = float(value)
              if not math.isfinite(vals[key]):
                  raise SystemExit(f"{key} is not finite")
          if not (-180 <= vals["min_lon"] < vals["max_lon"] <= 180):
              raise SystemExit("Invalid longitude bounds")
          if not (-90 <= vals["min_lat"] < vals["max_lat"] <= 90):
              raise SystemExit("Invalid latitude bounds")
          zoom = int("${{ inputs.max_zoom }}")
          if not 1 <= zoom <= 18:
              raise SystemExit("Invalid max_zoom")
          uuid.UUID("${{ inputs.job_id }}")
          uuid.UUID("${{ inputs.trip_id }}")
          PY

      - name: Determine Protomaps build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          for offset in 0 1 2 3 4 5 6 7; do
            BUILD_DATE="$(date -u -d "-$offset day" +%Y%m%d)"
            URL="https://build.protomaps.com/${BUILD_DATE}.pmtiles"
            if curl --fail --silent --show-error --range 0-0 --output /dev/null "$URL"; then
              echo "date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No recent Protomaps daily build found" >&2
          exit 1

      - name: Extract PMTiles
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/data" \
            ghcr.io/protomaps/go-pmtiles@sha256:06574f01f55a78f78f887bc7ebf729a5c093c0d6e17d9876300cfcb0758b59d3 \
            extract "${{ steps.build.outputs.url }}" "/data/$OUTPUT_FILE" \
            --bbox="${{ inputs.min_lon }},${{ inputs.min_lat }},${{ inputs.max_lon }},${{ inputs.max_lat }}" \
            --maxzoom="${{ inputs.max_zoom }}"
          test -s "$OUTPUT_FILE"
          ls -lh "$OUTPUT_FILE"

      - name: Upload PMTiles to Supabase Storage
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          OBJECT_KEY="${{ inputs.trip_id }}/${{ inputs.job_id }}.pmtiles"
          # Native Supabase Storage API statt des S3-Kompatibilitätslayers.
          # Bei unseren ~20-MB-PMTiles war der S3-Upload der mit Abstand langsamste Schritt.
          curl --fail --silent --show-error \
            --request POST \
            "$SUPABASE_URL/storage/v1/object/$BUCKET/$OBJECT_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$OUTPUT_FILE" \
            --output /dev/null
          FILE_SIZE="$(stat -c%s "$OUTPUT_FILE")"
          echo "object_key=$OBJECT_KEY" >> "$GITHUB_OUTPUT"
          echo "file_size=$FILE_SIZE" >> "$GITHUB_OUTPUT"

      - name: Mark job ready
        shell: bash
        run: |
          set -euo pipefail
          OBJECT_KEY="${{ steps.upload.outputs.object_key }}"
          FILE_SIZE="${{ steps.upload.outputs.file_size }}"
          FILE_NAME="${{ inputs.job_id }}.pmtiles"
          BODY="$(jq -nc \
            --arg status "ready" \
            --arg map_url "$OBJECT_KEY" \
            --arg file_name "$FILE_NAME" \
            --argjson file_size "$FILE_SIZE" \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,map_url:$map_url,file_name:$file_name,file_size:$file_size,completed_at:$completed_at,error_message:null}')"
          curl --fail --silent --show-error \
            -X PATCH "$SUPABASE_URL/rest/v1/offline_map_jobs?id=eq.${{ inputs.job_id }}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "$BODY"

      - name: Mark job failed
        if: failure()
        shell: bash
        run: |
          ERROR_MESSAGE="GitHub Actions konnte die Offline-Karte nicht erstellen oder speichern."
          BODY="$(jq -nc \
            --arg status "failed" \
            --arg error_message "$ERROR_MESSAGE" \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,error_message:$error_message,completed_at:$completed_at}')"
          curl --silent --show-error \
            -X PATCH "$SUPABASE_URL/rest/v1/offline_map_jobs?id=eq.${{ inputs.job_id }}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "$BODY" || true
